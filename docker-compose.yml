services:
  postgres:
    image: postgres:16-alpine
    container_name: galapagos-previene-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galapagos_previene}
      POSTGRES_USER: ${POSTGRES_USER:-galapagos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_esta_clave}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - galapagos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-galapagos} -d ${POSTGRES_DB:-galapagos_previene}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      target: bot
    image: galapagos-previene/bot:prod
    container_name: galapagos-previene-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?falta TELEGRAM_BOT_TOKEN}
      # Dentro de la red de Compose la base responde en el nombre del servicio,
      # no en localhost. Se construye aquí para que el DATABASE_URL del .env
      # (que apunta a localhost) siga sirviendo al ejecutar el bot en el host.
      DATABASE_URL: postgresql://${POSTGRES_USER:-galapagos}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-galapagos_previene}
      MAX_MEDIA_FILES: ${MAX_MEDIA_FILES:-10}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # El MP4 del tutorial no entra en la imagen: `video/out/` queda fuera del
      # repositorio y del build. En su lugar se guarda el file_id que Telegram
      # devolvió la primera vez (scripts/tutorial-file-id.py) y el bot reenvía
      # ese archivo. Sin valor, /tutorial responde solo con el texto de ayuda.
      TUTORIAL_VIDEO_FILE_ID: ${TUTORIAL_VIDEO_FILE_ID:-}
      TUTORIAL_VIDEO_PATH: ${TUTORIAL_VIDEO_PATH:-}
    # El bot no escribe archivos: persiste en PostgreSQL y deja las evidencias
    # alojadas en Telegram. Un sistema de archivos de solo lectura reduce el
    # impacto de una dependencia comprometida.
    read_only: true
    # Para subir el video desde el contenedor en vez de usar un file_id, monte
    # el render en solo lectura y apunte TUTORIAL_VIDEO_PATH a él. Requiere que
    # el archivo exista en el host: si falta, el contenedor no arranca.
    # volumes:
    #   - ./video/out/flujo-telegram-4k60.mp4:/app/media/tutorial.mp4:ro
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # SIGINT es la señal que python-telegram-bot maneja para apagar el pool de
    # PostgreSQL de forma ordenada, igual que hace la unidad systemd.
    stop_signal: SIGINT
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      target: api
    image: galapagos-previene/api:prod
    container_name: galapagos-previene-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Rol de solo lectura creado con sql/api_readonly.sql. Deliberadamente NO
      # se reutiliza POSTGRES_USER: la API no debe poder escribir reportes.
      API_DATABASE_URL: postgresql://galapagos_api:${API_DB_PASSWORD:?falta API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-galapagos_previene}
      # Claves separadas por coma. Para rotarlas se añade la nueva, se migra el
      # consumidor y después se retira la anterior.
      API_KEYS: ${API_KEYS:?falta API_KEYS}
      # Necesario para descargar las evidencias: el token no sale de este
      # proceso, la API actúa de intermediaria ante Telegram.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?falta TELEGRAM_BOT_TOKEN}
      API_MEDIA_CHUNK_SIZE: ${API_MEDIA_CHUNK_SIZE:-65536}
      API_MEDIA_TIMEOUT_SECONDS: ${API_MEDIA_TIMEOUT_SECONDS:-60}
      API_DB_POOL_MIN_SIZE: ${API_DB_POOL_MIN_SIZE:-1}
      API_DB_POOL_MAX_SIZE: ${API_DB_POOL_MAX_SIZE:-10}
      API_DB_COMMAND_TIMEOUT: ${API_DB_COMMAND_TIMEOUT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Solo accesible desde la propia VM, igual que PostgreSQL. SIGTAR corre
    # aquí mismo. Si algún día se consume desde fuera, hay que poner delante un
    # proxy con TLS en lugar de abrir este puerto.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    # SIGTAR consume esta API desde sus contenedores `api` y `worker`, que no
    # comparten red con este proyecto. No sirve `host.docker.internal`: el
    # puerto de arriba es solo loopback del host, mientras que ese nombre
    # resuelve al puente de Docker. Y tampoco se les puede unir a `default`,
    # porque aquí `postgres` es la base de Galápagos Previene y en SIGTAR es la
    # suya: el nombre quedaría ambiguo y podrían acabar leyendo la equivocada.
    #
    # De ahí una red dedicada, en la que el único nombre que se publica es
    # `galapagos-previene-api`. Se declara aquí, y no con un
    # `docker network connect` a mano, porque a mano no sobrevive a la
    # recreación de este contenedor: el 21 de agosto de 2026 se perdió así y
    # SIGTAR quedó seis días sirviendo reportes cacheados.
    #
    # `default` tiene que seguir en la lista: al declarar `networks` el
    # servicio deja de unirse a ella implícitamente y perdería `postgres`.
    networks:
      - default
      - sigtar-link
    # La API transmite los archivos por trozos hacia el cliente y nunca los
    # guarda, así que tampoco necesita escribir en su sistema de archivos.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # La imagen no trae curl; se usa el intérprete que ya está instalado.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Vive fuera de este compose porque la comparten dos proyectos, así que
  # ninguno de los dos puede ser su dueño. Se crea una vez:
  #
  #   docker network create sigtar-previene-link
  #
  # Solo se le une el servicio `api` de aquí, y `api` y `worker` de SIGTAR.
  sigtar-link:
    external: true
    name: sigtar-previene-link

volumes:
  galapagos_postgres_data:
